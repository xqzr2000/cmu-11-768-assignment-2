name: Offline dataset checks

on:
  pull_request:
  push:
    branches: [main, feature/phase-0-offline-evaluation]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check structural fixtures and tests without dependencies or API access
        run: |
          python3 scripts/offline_preflight.py
          python3 -m unittest discover -s tests -p 'test_offline_*.py' -v
      - name: Verify pinned dependency resolves with uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install official project and pinned sandbox
        run: uv sync --locked
      - name: Test deterministic validator checks without any model calls
        run: uv run python -m unittest discover -s tests -p "test_validator_*_offline.py" -v
      - name: Test experimental provider adapters with mocked clients only
        run: uv run python -m unittest discover -s tests -p "test_provider_*_offline.py" -v
      - name: Test bounded chart controller with offline state transitions only
        run: uv run python scripts/check_controller_offline.py
      - name: Test sandbox gateway with fake Docker and no network calls
        run: uv run python scripts/check_sandbox_gateway_offline.py
      - name: Test bounded task CSV snapshots and PNG decoding offline
        run: uv run python scripts/check_task_artifacts_offline.py
      - name: Test private CSV staging and fixed PNG extraction with local fakes only
        run: uv run python scripts/check_chart_transfer_offline.py
      - name: Test digest-guarded chart image Dockerfile recipe without Docker
        run: uv run python scripts/check_chart_image_recipe_offline.py
      - name: Test private minimal Docker build context without Docker
        run: uv run python scripts/check_chart_build_context_offline.py
      - name: Audit chart-only Linux AMD64 wheel hashes against committed uv.lock
        run: uv run python scripts/check_chart_wheel_lock_offline.py
      - name: Preview provider registry without network calls
        run: uv run python scripts/provider_preflight.py
