name: Import pinned official Assignment 2 starter

# One-time bootstrap. This runs only when this workflow is first added.
on:
  push:
    branches: [feature/phase-0-offline-evaluation]
    paths: [.github/workflows/bootstrap-official-starter.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy official starter files at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ASSIGNMENT.md ]; then
            echo "Official starter already imported; skipping."
            exit 0
          fi
          UPSTREAM_SHA=f609e76d2efd302b4b8babee06c5592899010b8b
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          git clone --filter=blob:none https://github.com/cmu-agents/assignment-2.git "$TEMP_DIR/source"
          git -C "$TEMP_DIR/source" checkout --detach "$UPSTREAM_SHA"
          test "$(git -C "$TEMP_DIR/source" rev-parse HEAD)" = "$UPSTREAM_SHA"
          rsync -a --exclude='.git/' --exclude='.github/workflows/' "$TEMP_DIR/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import pinned official Assignment 2 starter [skip ci]"
          git push origin HEAD:feature/phase-0-offline-evaluation
